<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>제갈금자 일정 관리</title>
<style>
:root{--ink:#39233f;--red:#b72e4d;--red2:#d94d68;--pink:#fbe5e5;--pink2:#fff4f0;--gold:#c99a50;--line:#f2cfd0;--purple:#eee7fa;--blue:#e6efff;--green:#e8f4df;--shadow:0 8px 24px #a94d5c18}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;background:radial-gradient(circle at 10% 5%,#ffe4eb 0,transparent 28%),radial-gradient(circle at 90% 10%,#f2e6ff 0,transparent 24%),linear-gradient(135deg,#fff8f4,#fff0f0);min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff9f7;color:var(--red);border-radius:14px;padding:9px 14px;font-weight:700}button:hover{filter:brightness(.98);transform:translateY(-1px)}.primary{background:linear-gradient(135deg,var(--red2),var(--red));color:white;border:0;box-shadow:0 4px 12px #b72e4d25}.top{max-width:1500px;margin:auto;padding:18px 22px 10px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;white-space:nowrap}.brand .sigil{font-size:28px;color:var(--gold)}nav{display:flex;gap:6px;padding:6px;background:#fff9;border:1px solid #f0d7dc;border-radius:22px;box-shadow:var(--shadow)}nav button{border:0;background:transparent;color:#8b5364}nav button.active{background:var(--red);color:#fff}.links{display:flex;gap:8px;margin-left:auto}.links a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--red);font-weight:800;background:#fff9;border:1px solid var(--line);border-radius:16px;padding:10px 13px}.links a span{font-size:18px}.gear{font-size:19px;padding:9px 13px}.wrap{max-width:1500px;margin:8px auto 28px;padding:0 20px}.panel{background:#fffaf8eF;border:1px solid #f4d5d7;border-radius:25px;box-shadow:var(--shadow);overflow:hidden}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid #f5dfe0;flex-wrap:wrap}.monthnav{display:flex;align-items:center;gap:16px;font-size:22px;font-weight:900}.monthnav button{border-radius:50%;width:40px;height:40px;padding:0;font-size:20px}.toolbar-right{display:flex;gap:8px}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:10px;gap:2px}.weekday{text-align:center;padding:10px;background:#fce5e3;color:#8f263e;font-weight:900;border:1px solid #f4c9cc;border-radius:12px}.day{background:#fffdfb;border:1px solid #f4d9d9;min-height:125px;padding:9px;border-radius:13px;min-width:0}.day.other{background:#fff5f5;color:#c9a9b0}.day.today{outline:2px solid var(--red2);outline-offset:-2px}.date{font-weight:900;display:flex;align-items:center;gap:7px;margin-bottom:9px}.todaytag{font-size:11px;background:var(--red);color:white;border-radius:20px;padding:2px 7px}.event{font-size:12px;padding:7px 8px;border-radius:12px;margin:5px 0;overflow-wrap:anywhere;background:var(--pink);color:#9e3150}.event.blue{background:var(--blue);color:#4667a8}.event.purple{background:var(--purple);color:#7650a7}.event.green{background:var(--green);color:#477a50}.event.gold{background:#fff0d7;color:#93672c}.event.red{background:#F8DFE4;color:#A54860}.event button{float:right;padding:0 4px;border:0;background:transparent;font-size:11px}.listview{padding:16px;display:grid;gap:10px}.listday{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fffdfb}.listday h3{margin:0 0 7px;color:var(--red)}.weekgrid{display:flex;flex-direction:column;gap:6px;padding:12px}
.weekrow{display:grid;grid-template-columns:112px minmax(0,1fr);gap:0;min-height:68px;border:1px solid var(--line);border-radius:15px;background:#fffdfb;overflow:hidden}
.weekdate{display:flex;flex-direction:column;justify-content:center;padding:10px 16px;background:#fff8f7;border-right:1px solid #f4e1e2;font-weight:900;font-size:17px;line-height:1.35}
.weekdate small{font-size:12px;color:#987783;font-weight:700}
.weekevents{display:flex;align-items:center;align-content:center;flex-wrap:wrap;gap:7px;padding:9px 14px;min-width:0}
.weekempty{display:flex;align-items:center;gap:9px;color:#a18d9b;font-weight:700;padding:8px 5px}
.weekrow.today{border:2px solid var(--red2);background:#fff8fb}
.weekrow.today .weekdate{background:#fce8ee;color:var(--red)}
@media(max-width:600px){.weekrow{grid-template-columns:76px minmax(0,1fr);min-height:62px}.weekdate{padding:8px;font-size:14px}.weekdate small{font-size:11px}.weekevents{padding:7px;gap:4px}}.settings{padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.setting-card{border:1px solid var(--line);border-radius:18px;padding:16px;background:#fffdfb}.setting-card h3{margin:0 0 12px;color:var(--red)}.field{display:grid;gap:5px;margin:9px 0}.field label{font-size:13px;font-weight:800;color:#76515c}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:white;color:var(--ink)}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.muted{color:#967b84;font-size:12px}.userline{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #f5e5e5;padding:9px 0;gap:8px}.userline button{padding:5px 9px;font-size:12px}.modalback{position:fixed;inset:0;background:#301b2c66;display:none;align-items:center;justify-content:center;padding:15px;z-index:5}.modal{background:#fffaf8;border:1px solid var(--line);border-radius:22px;padding:20px;width:min(520px,100%);box-shadow:0 20px 70px #381a3033}.modal h2{margin:0 0 12px;color:var(--red)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.empty{padding:24px;text-align:center;color:#9b7c85}.footer{text-align:center;color:#a98d94;font-size:12px;padding:12px}
@media(max-width:800px){.top{gap:10px}.links{margin-left:0}nav{order:3;width:100%;overflow:auto}nav button{white-space:nowrap}.day{min-height:90px;padding:5px}.event{font-size:10px;padding:5px}.weekday{font-size:12px;padding:7px}.grid{padding:5px}.monthnav{font-size:18px}.toolbar{padding:10px}.day .date{font-size:12px}}

.settings-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.settings-heading strong{font-size:20px;color:var(--red)}
.gear{position:relative;z-index:2;flex-shrink:0}
.gear.active-settings{background:var(--red);color:#fff}
@media(max-width:600px){
 .top{padding:12px 10px;gap:9px}
 .brand{font-size:17px}
 .brand .sigil{font-size:24px}
 .links{order:3;margin-left:0;width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
 .links a{justify-content:center;font-size:12px;padding:8px 3px}
 .gear{margin-left:auto}
 .wrap{padding:0 8px}
 .settings{grid-template-columns:1fr}
 .toolbar{gap:8px}
 .monthnav{font-size:16px;gap:5px}
 .monthnav button{width:32px;height:32px}
}
.brand-mascot{display:block;width:68px;height:68px;object-fit:contain;border-radius:50%;flex-shrink:0;background:#fff;box-shadow:0 2px 10px #a94d5c1c}
@media(max-width:600px){.brand-mascot{width:44px;height:44px}.brand{gap:6px}}

/* Ivory / white / crimson cohesive palette */
:root{--ink:#392D32;--red:#A83248;--red2:#B83D54;--pink:#F7E9EA;--pink2:#F7F4F0;--gold:#C99A50;--line:#E9DDDA;--shadow:0 8px 24px #59413813}
body{background:#F7F4F0;color:var(--ink)}
button{background:#FFFFFF;color:var(--red);border-color:var(--line)}
.primary{background:#A83248;color:white;box-shadow:0 4px 12px #A8324820}
nav{background:#FFFFFF;border-color:var(--line)}
nav button{color:#75666A}
nav button.active{background:#A83248;color:#FFFFFF}
.links a{background:#FFFFFF;border-color:var(--line)}
.panel{background:#FFFFFF;border-color:#E9DDDA}
.toolbar{background:#FFFFFF;border-bottom-color:#E9DDDA}
.weekday{background:#F2E6E5;border-color:#E9DDDA;color:#8F3545}
.day,.listday,.weekrow,.setting-card{background:#FFFFFF;border-color:#E9DDDA}
.day.other{background:#F8F6F3;color:#B2A5A2}
.day.today{outline-color:#A83248}
.weekdate{background:#F7F4F0;border-right-color:#E9DDDA}
.weekrow.today{background:#FFF9F8;border-color:#A83248}
.weekrow.today .weekdate{background:#F2E6E5;color:#A83248}
.event{background:#F7E9EA;color:#963E50}
.modal{background:#FFFFFF}
.field input,.field select,.field textarea{border-color:#E9DDDA}
.settings-heading{border-bottom-color:#E9DDDA}
.gear.active-settings{background:#A83248;color:white}

/* Rose-gray backdrop + clean light-gray calendar, unified crimson accent */
:root{--ink:#383239;--red:#A83248;--red2:#A83248;--pink:#F5E8EC;--pink2:#F5F3F4;--line:#E7E3E6;--shadow:0 8px 24px #3930390e}
body{background:#F5F3F4;color:var(--ink)}
.panel{background:#FFFFFF;border-color:#E7E3E6}
.toolbar{background:#FFFFFF;border-bottom-color:#E7E3E6}
nav,.links a,button{background:#FFFFFF;border-color:#E7E3E6}
nav button.active,.primary,.gear.active-settings{background:#A83248;color:#FFFFFF}
.weekday{background:#F0F0F2;border-color:#E7E3E6;color:#5E555E}
.day,.listday,.weekrow,.setting-card{background:#FFFFFF;border-color:#E7E3E6}
.day.other{background:#F8F8F9;color:#AAA5AB}
.day.today{outline-color:#A83248}
.weekdate{background:#F7F7F8;border-right-color:#E7E3E6}
.weekrow.today{background:#FFFAFB;border-color:#A83248}
.weekrow.today .weekdate{background:#F5E8EC;color:#A83248}
.event{background:#F5E8EC;color:#963E50}
.modal{background:#FFFFFF}
.field input,.field select,.field textarea{border-color:#E7E3E6}
.settings-heading{border-bottom-color:#E7E3E6}
.brand-mascot{background:#FFFFFF;box-shadow:0 2px 10px #39303912}

/* Soft mauve + lavender-white calendar + muted crimson accents */
:root{
 --ink:#4B4053;
 --red:#A54860;
 --red2:#A54860;
 --pink:#F2E2E8;
 --pink2:#EAE4E9;
 --line:#E3DCE4;
 --shadow:0 8px 24px #4B405311;
}
body{background:#273244;color:var(--ink)}
.panel{background:#F9F7FA;border-color:#E3DCE4}
.toolbar{background:#F9F7FA;border-bottom-color:#E3DCE4}
button,.links a,nav{background:#F9F7FA;border-color:#E3DCE4;color:#A54860}
nav button{color:#756B7C}
nav button.active,.primary,.gear.active-settings{background:#A54860;color:#FFFFFF;border-color:#A54860}
.primary{box-shadow:0 4px 12px #A5486026}
.weekday{background:#EDE7EF;border-color:#E3DCE4;color:#65566D}
.day,.listday,.weekrow,.setting-card{background:#F9F7FA;border-color:#E3DCE4}
.day.other{background:#F0EBF2;color:#A99EAC}
.day.today{outline-color:#A54860}
.weekdate{background:#F0EBF2;border-right-color:#E3DCE4}
.weekrow.today{background:#F9F0F4;border-color:#A54860}
.weekrow.today .weekdate{background:#F0DDE4;color:#A54860}
.event{background:#F2E2E8;color:#8E4358}
.modal{background:#F9F7FA}
.field input,.field select,.field textarea{background:#FFFFFF;border-color:#E3DCE4}
.settings-heading{border-bottom-color:#E3DCE4}
.brand-mascot{background:#F9F7FA;box-shadow:0 2px 10px #4B405311}
.todaytag{background:#A54860}

/* High-contrast title on deep navy */
.top .brand{color:#FFF8FA;}
.top .brand span{color:#FFF8FA;text-shadow:0 1px 3px #111A2B66;}
/* Click-to-edit calendar interactions */
.event{cursor:pointer;transition:filter .12s,transform .12s}
.event:hover,.event:focus-visible{filter:brightness(.95);outline:2px solid #A54860;outline-offset:1px}
.day{cursor:pointer}.day:hover{box-shadow:inset 0 0 0 2px #A5486050}
.date-clickable{cursor:pointer}.date-clickable:hover{color:#A54860}
.date-choice{max-height:80vh;overflow-y:auto}
.date-choice-item{display:block;width:100%;text-align:left;margin:8px 0;background:#F2E2E8;color:#794653}
.date-choice-item:hover{background:#E8C9D4}
.time-24{display:flex;align-items:center;gap:8px}.time-24 select{min-width:0;flex:1}.time-24 span{font-weight:700;color:#A54860}.time-hint{display:block;font-size:11px;color:#756B7C;margin-top:5px}.field #eventTime{width:100%;font-variant-numeric:tabular-nums}
/* Wide desktop layout: use nearly the full viewport width */
@media (min-width: 801px) {
  .top { max-width: none; width: 100%; padding-left: 14px; padding-right: 14px; }
  .wrap { max-width: none; width: 100%; margin: 8px auto 20px; padding-left: 12px; padding-right: 12px; }
  .grid { padding: 8px; gap: 4px; }
}
@media (min-width: 1400px) {
  .top { padding-left: 12px; padding-right: 12px; }
  .wrap { padding-left: 10px; padding-right: 10px; }
}

.date-choice{width:min(760px,100%);max-height:90vh;overflow:auto}
.date-choice-list{display:grid;gap:8px;margin:12px 0;max-height:45vh;overflow:auto}
.date-choice-line{display:flex;gap:8px;align-items:center;border:1px solid #ded5df;border-radius:12px;padding:5px;background:#fff}
.date-choice-line.selected{border-color:#A54860;background:#f9eef2}
.date-choice-item{flex:1;text-align:left;min-width:0;border:0;background:transparent;color:#4B4053;padding:11px;font-weight:600}
.order-controls{display:flex;gap:4px}
.order-controls button{min-width:34px}
.date-management-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;border-top:1px solid #ded5df;padding-top:14px}
.date-management-actions button{flex:1 1 auto;white-space:nowrap}
.date-management-actions .danger-outline{color:#A54860;border-color:#A54860;background:#fff}
.date-management-actions button:disabled,.order-controls button:disabled{opacity:.4;cursor:not-allowed}

.event.purple{background:#D8C2F0;color:#51247F}
.event.red{background:#EBA9B7;color:#80243B}

/* 달력 일정 텍스트 가독성 강화: 색상 배경은 그대로 유지 */
.event{font-weight:800!important;letter-spacing:-.01em;color:#352B3B!important}
.event.purple{color:#402064!important}
.event.green{color:#245332!important}
.event.red{color:#692036!important}
.event button{font-weight:800}
</style>

<script>
const $=id=>document.getElementById(id);
const today=new Date();let cursor=new Date(today.getFullYear(),today.getMonth(),1),view='month',editing=null;
const key='geumjaCalendarV1',settingsKey='geumjaSettingsV1';
let events=JSON.parse(localStorage.getItem(key)||'[]');
let settings=JSON.parse(localStorage.getItem(settingsKey)||'{"admin":"관리자","users":[],"cafe":"#","soop":"https://play.sooplive.co.kr/dlsn9911","youtube":"https://www.youtube.com/"}');
function save(){localStorage.setItem(key,JSON.stringify(events))}
function saveSettings(){localStorage.setItem(settingsKey,JSON.stringify(settings))}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function same(a,b){return a===iso(b)}
function fmtTime(t){if(!t)return '';const [h,m]=t.split(':');return `${String(Number(h)).padStart(2,'0')}:${String(Number(m||0)).padStart(2,'0')}`}
function canEdit(){return true /* 데모: 실제 계정 인증은 서버 연결 후 적용 */}
function render(){
 if(view==='week'){
  let ws=new Date(cursor);ws.setDate(ws.getDate()-ws.getDay());
  let we=new Date(ws);we.setDate(ws.getDate()+6);
  $('monthTitle').textContent=`${ws.getFullYear()}년 ${ws.getMonth()+1}월 ${ws.getDate()}일 ~ ${we.getMonth()+1}월 ${we.getDate()}일`;
 }else if(view==='day'){
  $('monthTitle').textContent=`${cursor.getFullYear()}년 ${cursor.getMonth()+1}월 ${cursor.getDate()}일 (${['일','월','화','수','목','금','토'][cursor.getDay()]})`;
 }else{
  $('monthTitle').textContent=`${cursor.getFullYear()}년 ${cursor.getMonth()+1}월`;
 }
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
 $('settingsBtn').classList.toggle('active-settings',view==='settings');
 $('settingsBtn').setAttribute('aria-label',view==='settings'?'일정관리로 돌아가기':'설정 열기');
 $('settingsBtn').setAttribute('aria-pressed',String(view==='settings'));
 const c=$('content');c.innerHTML='';
 if(view==='settings'){renderSettings(c);return}
 if(view==='day'){renderDay(c);return}
 if(view==='week'){renderWeek(c);return}
 renderMonth(c,false);
}
function eventNode(e){
 let div=document.createElement('div');div.className='event '+(['purple','green','red'].includes(e.color)?e.color:'red');
 div.textContent=(e.time?fmtTime(e.time)+' ':'')+e.title;
 div.title=(e.memo||'')+' (클릭하여 수정)';div.tabIndex=0;div.setAttribute('role','button');
 div.setAttribute('aria-label',e.title+' 일정 수정');
 div.onclick=ev=>{ev.stopPropagation();openModal(e)};
 div.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();ev.stopPropagation();openModal(e)}};
 return div;
}
function dayItems(date){
 return events.filter(e=>e.date===date).sort((a,b)=>{
  if(Number.isFinite(a.order)&&Number.isFinite(b.order))return a.order-b.order;
  if(Number.isFinite(a.order))return -1;
  if(Number.isFinite(b.order))return 1;
  return (a.time||'').localeCompare(b.time||'');
 });
}
function openDate(date){
 document.querySelectorAll('.date-choice-backdrop').forEach(x=>x.remove());
 const backdrop=document.createElement('div');backdrop.className='modalback date-choice-backdrop';backdrop.style.display='flex';
 const panel=document.createElement('div');panel.className='modal date-choice';
 const heading=document.createElement('h2');heading.textContent=date+' 일정';panel.appendChild(heading);
 const list=document.createElement('div');list.className='date-choice-list';panel.appendChild(list);
 const actions=document.createElement('div');actions.className='date-management-actions';
 const add=document.createElement('button');add.className='primary';add.textContent='＋ 일정 추가';
 const edit=document.createElement('button');edit.textContent='✎ 일정 수정';
 const del=document.createElement('button');del.textContent='▤ 일정 삭제';del.className='danger-outline';
 const reorder=document.createElement('button');reorder.textContent='↕ 순서 변경';
 const close=document.createElement('button');close.textContent='닫기';
 let selected=null,ordering=false;
 function draw(){
  const items=dayItems(date);
  if(selected&&!items.some(e=>e.id===selected))selected=null;
  list.innerHTML='';
  if(!items.length){const empty=document.createElement('p');empty.className='muted';empty.textContent='등록된 일정이 없습니다. 일정 추가 버튼으로 등록해 주세요.';list.appendChild(empty)}
  items.forEach((e,i)=>{
   const line=document.createElement('div');line.className='date-choice-line'+(selected===e.id?' selected':'');
   const b=document.createElement('button');b.type='button';b.className='date-choice-item';
   b.textContent=(e.time?fmtTime(e.time)+' · ':'')+e.title;
   b.onclick=()=>{selected=e.id;draw()};
   b.ondblclick=()=>{backdrop.remove();openModal(e)};
   line.appendChild(b);
   if(ordering){
    const controls=document.createElement('span');controls.className='order-controls';
    for(const [symbol,delta] of [['↑',-1],['↓',1]]){
     const arrow=document.createElement('button');arrow.type='button';arrow.textContent=symbol;
     arrow.setAttribute('aria-label',symbol==='↑'?'위로 이동':'아래로 이동');
     arrow.disabled=i+delta<0||i+delta>=items.length;
     arrow.onclick=()=>{
      const current=dayItems(date),j=i+delta;
      [current[i],current[j]]=[current[j],current[i]];
      current.forEach((item,index)=>item.order=index);
      save();render();draw();
     };controls.appendChild(arrow)
    }
    line.appendChild(controls);
   }
   list.appendChild(line);
  });
  edit.disabled=del.disabled=!items.length;
  reorder.disabled=items.length<2;
  reorder.textContent=ordering?'✓ 순서 변경 완료':'↕ 순서 변경';
 }
 add.onclick=()=>{backdrop.remove();openModal(null,date)};
 edit.onclick=()=>{const e=dayItems(date).find(x=>x.id===selected)||dayItems(date)[0];if(e){backdrop.remove();openModal(e)}};
 del.onclick=()=>{const e=dayItems(date).find(x=>x.id===selected)||dayItems(date)[0];if(!e)return;if(!confirm('「'+e.title+'」 일정을 삭제할까요?'))return;events=events.filter(x=>x.id!==e.id);save();render();draw()};
 reorder.onclick=()=>{ordering=!ordering;draw()};
 close.onclick=()=>backdrop.remove();
 actions.append(add,edit,del,reorder,close);panel.appendChild(actions);
 backdrop.appendChild(panel);backdrop.onclick=ev=>{if(ev.target===backdrop)backdrop.remove()};
 document.body.appendChild(backdrop);draw();
}
function renderMonth(c,all){
 let grid=document.createElement('div');grid.className='grid';['일','월','화','수','목','금','토'].forEach(x=>{let d=document.createElement('div');d.className='weekday';d.textContent=x;grid.appendChild(d)});
 let first=new Date(cursor.getFullYear(),cursor.getMonth(),1),start=new Date(first);start.setDate(1-first.getDay());
 for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);if(!all&&i>=35&&d.getMonth()!==cursor.getMonth())continue;
 let cell=document.createElement('div');cell.className='day'+(d.getMonth()!==cursor.getMonth()?' other':'')+(same(iso(d),today)?' today':'');
 let date=document.createElement('div');date.className='date';date.textContent=d.getDate();if(same(iso(d),today)){let tag=document.createElement('span');tag.className='todaytag';tag.textContent='오늘';date.appendChild(tag)}cell.appendChild(date);
 dayItems(iso(d)).forEach(e=>cell.appendChild(eventNode(e)));
 cell.onclick=ev=>{if(!ev.target.closest('.event'))openDate(iso(d))};cell.tabIndex=0;cell.setAttribute('aria-label',iso(d)+' 일정 열기');cell.onkeydown=ev=>{if(ev.target===cell&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();openDate(iso(d))}};grid.appendChild(cell)}
 c.appendChild(grid);
}
function renderDay(c){let d=iso(cursor);let box=document.createElement('div');box.className='listview';let h=document.createElement('h2');h.textContent=d;h.className='date-clickable';h.onclick=()=>openDate(d);h.title='날짜를 클릭하여 일정 선택';box.appendChild(h);let arr=dayItems(d);if(!arr.length)box.innerHTML+='<div class="empty">등록된 일정이 없습니다.</div>';arr.forEach(e=>box.appendChild(eventNode(e)));c.appendChild(box)}
function renderWeek(c){
 let base=new Date(cursor.getFullYear(),cursor.getMonth(),cursor.getDate());
 base.setDate(base.getDate()-base.getDay());
 let g=document.createElement('div');g.className='weekgrid';
 for(let i=0;i<7;i++){
  let d=new Date(base);d.setDate(base.getDate()+i);
  let row=document.createElement('div');
  row.className='weekrow'+(same(iso(d),today)?' today':'');
  let label=document.createElement('div');label.className='weekdate';
  label.innerHTML=`${d.getDate()}일<small>(${['일','월','화','수','목','금','토'][i]})</small>`;
  if(same(iso(d),today)){
   let tag=document.createElement('span');tag.className='todaytag';tag.textContent='오늘';label.appendChild(tag);
  }
  let body=document.createElement('div');body.className='weekevents';
  let dayEvents=dayItems(iso(d));
  if(dayEvents.length){
   dayEvents.forEach(e=>body.appendChild(eventNode(e)));
  }else{
   let empty=document.createElement('div');empty.className='weekempty';
   empty.innerHTML='<span>☺</span><span>일정이 없습니다!</span>';body.appendChild(empty);
  }
  label.classList.add('date-clickable');label.tabIndex=0;label.setAttribute('role','button');label.title='날짜를 클릭하여 일정 선택';label.onclick=()=>openDate(iso(d));label.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();openDate(iso(d))}};body.onclick=ev=>{if(!ev.target.closest('.event'))openDate(iso(d))};row.append(label,body);g.appendChild(row);
 }
 c.appendChild(g);
}
function renderSettings(c){
 let back=document.createElement('div');
 back.className='settings-heading';
 back.innerHTML='<strong>⚙ 설정</strong>';
 c.appendChild(back);
 let wrap=document.createElement('div');wrap.className='settings';
 wrap.innerHTML=`<div class="setting-card"><h3>관리자 설정</h3><div class="field"><label>관리자 이름</label><input id="adminName" value="${esc(settings.admin)}"></div><button class="primary" id="saveAdmin">관리자 저장</button><p class="muted">현재 데모에서는 이름만 저장됩니다. 실제 로그인·권한 검증은 서버 연결이 필요합니다.</p></div>
 <div class="setting-card"><h3>일정 수정 권한 사용자</h3><div class="field"><label>사용자 이름 또는 이메일</label><input id="newUser" placeholder="예: user@example.com"></div><button id="addUser">＋ 사용자 지정</button><div id="userList"></div></div>
 <div class="setting-card"><h3>공식 채널 링크</h3><div class="field"><label>SOOP 주소</label><input id="setSoop" value="${esc(settings.soop)}"></div><div class="field"><label>YouTube 주소</label><input id="setYoutube" value="${esc(settings.youtube)}"></div><div class="field"><label>팬카페 주소</label><input id="setCafe" value="${esc(settings.cafe)}"></div><button class="primary" id="saveLinks">링크 저장</button></div>
 <div class="setting-card"><h3>일정 데이터</h3><button id="exportData">일정 백업 다운로드</button> <button id="importBtn">백업 불러오기</button><input type="file" id="importFile" accept="application/json" hidden><p class="muted">데이터는 현재 브라우저에 저장됩니다. 다른 사람과 실시간 공유되지는 않습니다.</p></div>`;
 c.appendChild(wrap);
 $('saveAdmin').onclick=()=>{settings.admin=$('adminName').value.trim()||'관리자';saveSettings();alert('관리자 이름을 저장했습니다.')};
 const list=$('userList');function drawUsers(){list.innerHTML='';settings.users.forEach((u,i)=>{let row=document.createElement('div');row.className='userline';let s=document.createElement('span');s.textContent=u;let b=document.createElement('button');b.textContent='삭제';b.onclick=()=>{settings.users.splice(i,1);saveSettings();drawUsers()};row.append(s,b);list.appendChild(row)})}drawUsers();
 $('addUser').onclick=()=>{let u=$('newUser').value.trim();if(u&&!settings.users.includes(u)){settings.users.push(u);saveSettings();$('newUser').value='';drawUsers()}};
 $('saveLinks').onclick=()=>{settings.soop=$('setSoop').value.trim();settings.youtube=$('setYoutube').value.trim();settings.cafe=$('setCafe').value.trim();saveSettings();applyLinks();alert('채널 링크를 저장했습니다.')};
 $('exportData').onclick=()=>{let blob=new Blob([JSON.stringify({events,settings},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='제갈금자_일정백업.json';a.click();URL.revokeObjectURL(a.href)};
 $('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{let o=JSON.parse(await e.target.files[0].text());if(Array.isArray(o.events))events=o.events;if(o.settings)settings=o.settings;save();saveSettings();render();alert('백업을 불러왔습니다.')}catch{alert('백업 파일을 읽지 못했습니다.')}};
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function applyLinks(){[['soopLink',settings.soop],['youtubeLink',settings.youtube],['cafeLink',settings.cafe]].forEach(([id,url])=>$(id).href=url||'#')}
function openModal(e=null,date=null){editing=e?.id||null;$('modalTitle').textContent=e?'일정 수정':'일정 추가';$('eventTitle').value=e?.title||'';$('eventDate').value=e?.date||date||iso(today);$('eventTime').value=e?.time||'';$('eventColor').value=['purple','green','red'].includes(e?.color)?e.color:'red'; $('eventMemo').value=e?.memo||'';$('deleteEvent').style.display=e?'inline-flex':'none';$('modalBack').style.display='flex'}
function closeModal(){$('modalBack').style.display='none'}
$('saveEvent').onclick=()=>{let title=$('eventTitle').value.trim();if(!title){alert('일정 제목을 입력해 주세요.');return}let time=$('eventTime').value.trim();if(time){const match=time.match(/^(\d{1,2}):(\d{2})$/);if(!match||Number(match[1])>23||Number(match[2])>59){alert('시간을 24시간제 HH:MM 형식으로 입력해 주세요. (예: 14:30)');$('eventTime').focus();return}time=match[1].padStart(2,'0')+':'+match[2]}let item={id:editing||String(Date.now()),title,date:$('eventDate').value,time:time,color:$('eventColor').value||'red', memo:$('eventMemo').value,order:editing?events.find(x=>x.id===editing)?.order:undefined};if(editing){let i=events.findIndex(x=>x.id===editing);if(i>=0)events[i]=item}else events.push(item);save();closeModal();render()};
$('deleteEvent').onclick=()=>{if(!editing)return;if(!confirm('이 일정을 삭제할까요? 삭제한 일정은 되돌릴 수 없습니다.'))return;events=events.filter(x=>x.id!==editing);editing=null;save();closeModal();render()};
$('cancelModal').onclick=closeModal;$('addBtn').onclick=()=>openModal();$('settingsBtn').onclick=()=>{view=view==='settings'?'month':'settings';render()};function movePeriod(amount){
 if(view==='week')cursor.setDate(cursor.getDate()+amount*7);
 else if(view==='day')cursor.setDate(cursor.getDate()+amount);
 else cursor.setMonth(cursor.getMonth()+amount);
 render();
}
$('prev').onclick=()=>movePeriod(-1);
$('next').onclick=()=>movePeriod(1);
$('todayBtn').onclick=()=>{cursor=new Date(today.getFullYear(),today.getMonth(),today.getDate());view='month';render()};
$('tabs').onclick=e=>{let b=e.target.closest('button[data-view]');if(b){
 view=b.dataset.view;
 if(view==='week'||view==='day')cursor=new Date(today.getFullYear(),today.getMonth(),today.getDate());
 else cursor=new Date(today.getFullYear(),today.getMonth(),1);
 render();
}};
applyLinks();render();
</script>
</body></html>
